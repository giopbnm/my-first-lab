---
- name: 拠点を検索する (API直接)
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/dcim/sites/?name=Tokyo-Lab"
    method: GET
    headers:
      Authorization: "Token {{ netbox_token }}"
    validate_certs: "{{ netbox_validate_certs }}"
  register: search_api_result

- name: 検索結果を表示
  ansible.builtin.debug:
    msg: "拠点のIDは {{ search_api_result.json.results[0].id }} です"
  when: search_api_result.json.count > 0
